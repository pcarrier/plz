[package]
name = "plz"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
rpassword = "7"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
lto = true
strip = true
opt-level = "s"
